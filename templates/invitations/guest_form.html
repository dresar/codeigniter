{% extends 'invitations/base.html' %}

{% block title %}Tambah Guest{% endblock %}

{% block header_title %}Tambah Guest{% endblock %}

{% block content %}
<div class="py-8">
    <div class="max-w-2xl mx-auto px-4">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Tambah Guest</h2>
            <form method="post">
                {% csrf_token %}
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nama</label>
                        {{ form.name }}
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        {{ form.email }}
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">No. Telepon</label>
                        {{ form.phone }}
                    </div>
                </div>
                <div class="flex space-x-4 mt-6">
                    <button type="submit" 
                            class="flex-1 px-6 py-3 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition-colors">
                        Simpan
                    </button>
                    <a href="{% url 'invitations:invitation_detail_edit' invitation.pk %}" 
                       class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                        Batal
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
