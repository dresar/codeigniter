{% extends 'invitations/base.html' %}

{% block title %}Hapus Guest{% endblock %}

{% block header_title %}Hapus Guest{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Hapus Guest</h2>
        <p class="text-gray-600 mb-6">
            Apakah Anda yakin ingin menghapus guest <strong>{{ guest.name }}</strong>?
        </p>
        <form method="post" class="flex space-x-4">
            {% csrf_token %}
            <button type="submit" 
                    class="flex-1 px-6 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">
                Ya, Hapus
            </button>
            <a href="{% url 'invitations:invitation_detail_edit' guest.invitation.pk %}" 
               class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                Batal
            </a>
        </form>
    </div>
</div>
{% endblock %}
